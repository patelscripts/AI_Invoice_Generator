name: AI Invoice Generator CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 🔹 FRONTEND SETUP
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      # 🔹 BACKEND SETUP
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: Run Backend Check
        run: |
          cd backend
          npm start &
          sleep 5