name: AI Invoice Generator CI

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 🔹 Setup Node (LTS recommended)
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      # 🔹 FRONTEND
      - name: Install Frontend Dependencies
        run: |
          cd Frontend
          npm install

      - name: Build Frontend
        run: |
          cd Frontend
          npm run build

      # 🔹 BACKEND
      - name: Install Backend Dependencies
        run: |
          cd Backend
          npm install

      - name: Run Backend Check
        run: |
          cd Backend
          npm start &
          sleep 5